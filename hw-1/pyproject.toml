[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-hw-1"
version = "0.1.0"
description = "Консольное приложение для учёта парка кикшеринга ВышКат"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
sd-hw-1 = "sd_hw_1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sd_hw_1 --cov-report=term-missing --cov-fail-under=60"

[tool.ruff]
line-length = 100
target-version = "py310"

